name: CI/CD - NestJS Backend (Fly.io)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ----------------------------------------------------
  # 1. Integração Contínua (Testes, Lint e Build)
  # ----------------------------------------------------
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Check Build
        run: npm run build

  # ----------------------------------------------------
  # 2. Entrega Contínua (Deploy para o Fly.io)
  # ----------------------------------------------------
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: validate
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
