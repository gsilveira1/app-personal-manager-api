services:
  postgres:
    image: postgres:16-alpine
    container_name: personalops-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-gym_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-gym_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: personalops-redis-dev
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: personalops-mailpit-dev
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: personalops-evolution-api-dev
    restart: always
    environment:
      - SERVER_URL=http://localhost:${EVOLUTION_PORT:-8080}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-personalops_secret_token_123}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-gym_management}?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=personalops_evolution_dev
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1047994416-alpha
      - WEB_VERSION=2.3000.1047994416-alpha
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_instances_dev:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalops-api-dev
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npm run build && npm run start:dev"
    environment:
      - NODE_ENV=development
      - PORT=9090
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-gym_management}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-seu_segredo_aqui}
      - TRAINER_USER_ID=${TRAINER_USER_ID:-}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-personalops_secret_token_123}
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL:-}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY:-}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "${PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres_dev_data:
  redis_dev_data:
  evolution_instances_dev:
