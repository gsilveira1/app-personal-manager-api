# fly.toml app configuration file generated for app-personal-manager-api on 2026-07-26T23:52:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app            = 'app-personal-manager-api'
primary_region = 'gru'

# ─── Orquestração Multi-Container ──────────────────────────────────────────────
# Utiliza o Docker Compose para orquestrar NestJS + Postgres (pgvector) + WAHA
# como containers sidecars na exata mesma Máquina Fly.io (shared localhost network).

[build.compose]
  file = "docker-compose.prod.yml"

# ─── Variáveis de Ambiente Estáticas (Não-Sensíveis) ───────────────────────────

[env]
  NODE_ENV      = "production"
  PORT          = "8080"
  WAHA_API_URL  = "http://127.0.0.1:3000"
  DATABASE_HOST = "127.0.0.1"
  DATABASE_PORT = "5432"

# ─── Mapeamento de Volumes Persistentes ────────────────────────────────────────

[[mounts]]
  source      = "pg_data"
  destination = "/var/lib/postgresql/data"
  processes   = ["postgres"]

[[mounts]]
  source      = "waha_data"
  destination = "/.waha/core/sessions"
  processes   = ["waha"]

# ─── Exposição de Rede Pública (Apenas NestJS com TLS) ─────────────────────────
# As portas 5432 (Postgres) e 3000 (WAHA) NÃO são listadas aqui e permanecem
# estritamente isoladas na interface loopback 127.0.0.1 da VM.

[[services]]
  protocol      = "tcp"
  internal_port = 8080
  processes     = ["app"]

  [[services.ports]]
    port        = 80
    handlers    = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "10s"

# ─── Dimensionamento de Máquina (Proteção contra OOM do Chromium/WAHA) ─────────

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '3gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 3072
  processes = ['app']
