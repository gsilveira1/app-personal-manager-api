# fly.toml app configuration file generated for app-personal-manager-api on 2026-07-26T22:23:21-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'app-personal-manager-api'
primary_region = 'gru'

[build]
[deploy]
  release_command = 'npx prisma migrate deploy'
  seed_command = 'ts-node -r dotenv/config prisma/seed.ts'

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
